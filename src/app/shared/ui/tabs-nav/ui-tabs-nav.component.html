<nav class="ui-tabs-nav" [attr.aria-label]="ariaLabel()">
  <p-tabs [value]="activeValue()" [scrollable]="true">
    <p-tablist>
      @for (item of items(); track item.value) {
        <p-tab [value]="item.value" [disabled]="item.disabled ?? false" (click)="navigate(item)">
          <span class="ui-tabs-nav__label">{{ item.label }}</span>
        </p-tab>
      }
    </p-tablist>
  </p-tabs>
</nav>
