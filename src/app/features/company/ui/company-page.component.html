<app-master-detail-page-shell [title]="texts.pageTitle" [subtitle]="texts.pageSubtitle">
  <section shellMaster>
    <app-company-list
      [companies]="store.companies()"
      [selectedKey]="store.selectedKey()"
      [loading]="store.listLoading()"
      [errorMessage]="store.listError() ? texts.listLoadFailedMessage : null"
      (newRequested)="onNewCompany()"
      (companySelected)="onCompanySelected($event)"
    />
  </section>

  <section shellDetail class="company-page__detail-slot">
    @if (store.hasActiveDetail()) {
      @if (store.detailLoading()) {
        <app-panel [title]="texts.detailPanelTitle" [subtitle]="texts.detailLoadingMessage">
          <p class="company-page__feedback company-page__feedback--loading">{{ texts.detailLoadingMessage }}</p>
        </app-panel>
      } @else if (store.detailError() === 'not-found') {
        <app-panel [title]="texts.detailPanelTitle">
          <p class="company-page__feedback company-page__feedback--error">{{ texts.detailNotFoundMessage }}</p>
        </app-panel>
      } @else if (store.detailError()) {
        <app-panel [title]="texts.detailPanelTitle">
          <p class="company-page__feedback company-page__feedback--error">{{ texts.detailLoadFailedMessage }}</p>
        </app-panel>
      } @else {
        <app-company-detail-panel
          [mode]="detailMode"
          [detail]="store.selectedDetail()"
          [submitting]="store.submitting()"
          [submitError]="store.submitError()"
          [submitSuccess]="store.submitSuccess()"
          (editRequested)="onEditRequested()"
          (submitted)="onFormSubmit($event)"
          (cancelled)="onFormCancel()"
        />
      }
    } @else {
      <app-panel [title]="texts.detailPanelTitle" [subtitle]="texts.emptyDetailDescription">
        <app-empty-state [title]="texts.emptyDetailTitle" [description]="texts.emptyDetailDescription" />
      </app-panel>
    }
  </section>
</app-master-detail-page-shell>
