<div class="employee-page">
  <app-employee-page-header
    class="employee-page__header"
    [fullName]="fullName"
    [employeeNumber]="employeeNumber"
    [ruleSystemCode]="ruleSystemCode"
    [employeeTypeCode]="employeeTypeCode"
    [status]="status"
    [companyCode]="companyCode"
    [workCenterCode]="workCenterCode"
    [hireDate]="hireDate"
    [email]="email"
    [phone]="phone"
  ></app-employee-page-header>

  <section class="employee-main" aria-label="Contenido principal de la ficha de empleado">
    <div class="employee-main__sections" role="region" aria-label="Secciones de empleado">
      <app-employee-section-shell
        [title]="'Contact'"
        [subtitle]="'Communication channels for the employee'"
        [actions]="contactActions"
        [state]="sectionState"
      >
        <div class="employee-page__dummy-content">
          <p class="employee-page__dummy-row">Email: ana.garcia@example.com</p>
          <p class="employee-page__dummy-row">Mobile: +34 600 111 222</p>
        </div>
      </app-employee-section-shell>

      <app-employee-section-shell
        [title]="'Identifiers'"
        [subtitle]="'Current identification records'"
        [actions]="identifierActions"
        [state]="sectionState"
      >
        <div class="employee-page__dummy-content">
          <p class="employee-page__dummy-row">National ID: 12345678A</p>
          <p class="employee-page__dummy-row">Social Security: 01/1234567890</p>
        </div>
      </app-employee-section-shell>

      <app-employee-section-shell
        [title]="'Address'"
        [subtitle]="'Residence and correspondence location'"
        [actions]="addressActions"
        [state]="sectionState"
      >
        <div class="employee-page__dummy-content">
          <p class="employee-page__dummy-row">Main address: Calle Mayor 10, Madrid</p>
          <p class="employee-page__dummy-row">Postal code: 28013</p>
        </div>
      </app-employee-section-shell>
    </div>
  </section>

  <aside class="employee-timeline" aria-label="Panel de timeline del empleado">
    <div class="employee-timeline__panel">
      <app-employee-timeline-panel></app-employee-timeline-panel>
    </div>
  </aside>
</div>
