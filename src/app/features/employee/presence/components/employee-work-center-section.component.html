<app-temporal-section
  [title]="texts.workCenterSectionTitle"
  [subtitle]="sectionSubtitle"
  [state]="sectionState()"
  [displayMode]="displayMode()"
  [rows]="rows()"
  [texts]="sectionTexts"
  [confirmingCloseKey]="confirmingCloseKey()"
  [confirmingDeleteKey]="confirmingDeleteKey()"
  [correctingKey]="correctingKey()"
  [canCreate]="true"
  [canEditCurrent]="false"
  [canCorrect]="true"
  [canClose]="true"
  [canDelete]="true"
  [createSubmitEnabled]="isCreateDraftValid()"
  [correctSubmitEnabled]="isCorrectDraftValid()"
  (manageStarted)="startManage()"
  (manageExited)="exitManage()"
  (createStarted)="startCreate()"
  (correctStarted)="startCorrect($event)"
  (closeRequested)="requestClose($event)"
  (deleteRequested)="requestDelete($event)"
  (closeConfirmed)="confirmClose($event)"
  (deleteConfirmed)="confirmDelete($event)"
  (cancelled)="cancel()"
  (createSubmitted)="submitCreate()"
  (correctSubmitted)="submitCorrect($event)"
>
  <div temporalCreateForm class="employee-work-center-section__form-grid">
    <label class="employee-work-center-section__field employee-work-center-section__field--code">
      <span>{{ texts.workCenterSectionCodeLabel }}</span>
      <app-ui-select
        [value]="createDraft().workCenterCode"
        [disabled]="catalogOptionsLoading()"
        (valueChanged)="updateCreateField('workCenterCode', $event)"
      >
        <option value="">{{ texts.workCenterSectionCodeLabel }}</option>
        @for (option of createWorkCenterCodeOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>

    <label class="employee-work-center-section__field employee-work-center-section__field--start-date">
      <span>{{ texts.workCenterSectionStartDateLabel }}</span>
      <app-ui-date-input [value]="createDraft().startDate" (valueChanged)="updateCreateField('startDate', $event)" />
    </label>

    <label class="employee-work-center-section__field employee-work-center-section__field--end-date">
      <span>{{ texts.workCenterSectionEndDateLabel }}</span>
      <app-ui-date-input [value]="createDraft().endDate" (valueChanged)="updateCreateField('endDate', $event)" />
    </label>
  </div>

  <div temporalCorrectForm class="employee-work-center-section__form-grid">
    @if (correctingRow(); as correctingRow) {
      <div class="employee-work-center-section__readonly-field">
        <span>{{ texts.workCenterSectionAssignmentLabel }}</span>
        <strong>#{{ correctingRow.workCenterAssignmentNumber }}</strong>
      </div>

      <p class="employee-work-center-section__hint">{{ texts.workCenterSectionCorrectionHint }}</p>
    }

    <label class="employee-work-center-section__field employee-work-center-section__field--code">
      <span>{{ texts.workCenterSectionCodeLabel }}</span>
      <app-ui-select
        [value]="correctDraft().workCenterCode"
        [disabled]="catalogOptionsLoading()"
        (valueChanged)="updateCorrectField('workCenterCode', $event)"
      >
        <option value="">{{ texts.workCenterSectionCodeLabel }}</option>
        @for (option of correctWorkCenterCodeOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>

    <label class="employee-work-center-section__field employee-work-center-section__field--start-date">
      <span>{{ texts.workCenterSectionStartDateLabel }}</span>
      <app-ui-date-input [value]="correctDraft().startDate" (valueChanged)="updateCorrectField('startDate', $event)" />
    </label>

    <label class="employee-work-center-section__field employee-work-center-section__field--end-date">
      <span>{{ texts.workCenterSectionEndDateLabel }}</span>
      <app-ui-date-input [value]="correctDraft().endDate" (valueChanged)="updateCorrectField('endDate', $event)" />
    </label>
  </div>

  <div temporalConfirmCloseForm class="employee-work-center-section__close-form">
    <p class="employee-work-center-section__hint">{{ texts.workCenterSectionCloseHint }}</p>

    <label class="employee-work-center-section__field employee-work-center-section__field--close-date">
      <span>{{ texts.workCenterSectionCloseDateLabel }}</span>
      <app-ui-date-input [value]="closeEndDate()" (valueChanged)="updateCloseEndDate($event)" />
    </label>
  </div>
</app-temporal-section>
