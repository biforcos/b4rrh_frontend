<app-temporal-section
  [title]="texts.contractSectionTitle"
  [subtitle]="sectionSubtitle"
  [state]="sectionState()"
  [displayMode]="displayMode()"
  [rows]="rows()"
  [texts]="sectionTexts"
  [confirmingCloseKey]="confirmingCloseKey()"
  [correctingKey]="correctingKey()"
  [canCreate]="supportedActions().canReplaceFromDate"
  [canEditCurrent]="false"
  [canCorrect]="supportedActions().canCorrect"
  [canClose]="supportedActions().canClose"
  [canDelete]="supportedActions().canDelete"
  [createSubmitEnabled]="isReplaceDraftValid()"
  [correctSubmitEnabled]="isCorrectDraftValid()"
  (manageStarted)="startReplaceFromDate()"
  (manageExited)="exitManage()"
  (createStarted)="startReplaceFromDate()"
  (correctStarted)="startCorrect($event)"
  (closeRequested)="requestClose($event)"
  (closeConfirmed)="confirmClose($event)"
  (cancelled)="cancel()"
  (createSubmitted)="submitReplaceFromDate()"
  (correctSubmitted)="submitCorrect($event)"
>
  <div temporalCreateForm class="employee-contract-section__form-grid employee-contract-section__form-grid--create">
    <label class="employee-contract-section__field employee-contract-section__field--effective-date">
      <span>{{ texts.contractSectionEffectiveDateLabel }}</span>
      <app-ui-date-input
        [value]="replaceDraft().effectiveDate"
        (valueChanged)="updateReplaceField('effectiveDate', $event)"
      />
    </label>

    <label class="employee-contract-section__field employee-contract-section__field--contract">
      <span>{{ texts.contractSectionContractLabel }}</span>
      <app-ui-select
        [value]="replaceDraft().contractCode"
        [disabled]="contractTypeOptionsLoading()"
        (valueChanged)="updateReplaceField('contractCode', $event)"
      >
        <option value="">{{ texts.contractSectionContractLabel }}</option>
        @for (option of contractTypeOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>

    <label class="employee-contract-section__field employee-contract-section__field--subtype">
      <span>{{ texts.contractSectionSubtypeLabel }}</span>
      <app-ui-select
        [value]="replaceDraft().contractSubtypeCode"
        [disabled]="replaceSubtypeDisabled()"
        (valueChanged)="updateReplaceField('contractSubtypeCode', $event)"
      >
        <option value="">{{ texts.contractSectionSubtypeLabel }}</option>
        @for (option of replaceSubtypeOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>
  </div>

  <div temporalCorrectForm class="employee-contract-section__form-grid employee-contract-section__form-grid--correct">
    @if (correctingOccurrence(); as correctingOccurrence) {
      <label class="employee-contract-section__field employee-contract-section__field--start-readonly">
        <span>{{ texts.contractSectionOccurrenceStartDateLabel }}</span>
        <input type="text" [value]="correctingOccurrence.startDate" readonly />
      </label>
    }

    <label class="employee-contract-section__field employee-contract-section__field--contract">
      <span>{{ texts.contractSectionContractLabel }}</span>
      <app-ui-select
        [value]="correctDraft().contractCode"
        [disabled]="contractTypeOptionsLoading()"
        (valueChanged)="updateCorrectField('contractCode', $event)"
      >
        <option value="">{{ texts.contractSectionContractLabel }}</option>
        @for (option of contractTypeOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>

    <label class="employee-contract-section__field employee-contract-section__field--subtype">
      <span>{{ texts.contractSectionSubtypeLabel }}</span>
      <app-ui-select
        [value]="correctDraft().contractSubtypeCode"
        [disabled]="correctSubtypeDisabled()"
        (valueChanged)="updateCorrectField('contractSubtypeCode', $event)"
      >
        <option value="">{{ texts.contractSectionSubtypeLabel }}</option>
        @for (option of correctSubtypeOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>
  </div>

  <div temporalConfirmCloseForm class="employee-contract-section__close-form">
    <p class="employee-contract-section__hint">{{ texts.contractSectionCloseHint }}</p>

    <label class="employee-contract-section__field employee-contract-section__field--close-date">
      <span>{{ texts.contractSectionCloseDateLabel }}</span>
      <app-ui-date-input
        [value]="closeDraft().endDate"
        (valueChanged)="updateCloseField('endDate', $event)"
      />
    </label>
  </div>
</app-temporal-section>
