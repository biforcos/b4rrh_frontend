<div class="labor-classification-section">
  <app-period-table
    sectionTitle="Convenio"
    [rows]="rows()"
    (addClicked)="openCreate()"
    (editClicked)="openEdit($event)"
  >
    <ng-template #columnHeaders>
      <th>Convenio</th>
      <th>Categoría</th>
    </ng-template>
    <ng-template #cellContent let-row>
      <td class="labor-classification-section__cell">{{ row.agreementCode }}</td>
      <td class="labor-classification-section__cell labor-classification-section__cell--secondary">
        {{ row.agreementCategoryCode || '—' }}
      </td>
    </ng-template>
  </app-period-table>

  <app-period-modal
    [title]="modalTitle()"
    [subtitle]="modalSubtitle()"
    [visible]="modalVisible()"
    [saving]="saving()"
    [submitEnabled]="isSubmitEnabled()"
    [showCloseAction]="modalMode() === 'edit' && editingIsActive()"
    (visibleChange)="modalVisible.set($event)"
    (submitted)="submit()"
    (cancelled)="closeModal()"
    (closeActionClicked)="switchToClose()"
  >
    @if (modalMode() === 'create') {
      <app-ui-date-input
        [value]="effectiveDateDraft()"
        (valueChanged)="effectiveDateDraft.set($event)" />
      <app-ui-select
        [options]="agreementOptions()"
        [value]="agreementCodeDraft()"
        (valueChanged)="updateAgreementCode($event)" />
      <app-ui-select
        [options]="categoryOptions()"
        [value]="agreementCategoryCodeDraft()"
        [disabled]="categoryDisabled()"
        (valueChanged)="agreementCategoryCodeDraft.set($event)" />
    }

    @if (modalMode() === 'edit') {
      <app-ui-select
        [options]="agreementOptions()"
        [value]="agreementCodeDraft()"
        (valueChanged)="updateAgreementCode($event)" />
      <app-ui-select
        [options]="categoryOptions()"
        [value]="agreementCategoryCodeDraft()"
        [disabled]="categoryDisabled()"
        (valueChanged)="agreementCategoryCodeDraft.set($event)" />
    }

    @if (modalMode() === 'close') {
      <app-ui-date-input
        [value]="endDateDraft()"
        (valueChanged)="endDateDraft.set($event)" />
    }
  </app-period-modal>
</div>
