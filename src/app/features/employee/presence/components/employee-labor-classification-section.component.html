<app-temporal-section
  [title]="texts.laborClassificationSectionTitle"
  [subtitle]="sectionSubtitle"
  [state]="sectionState()"
  [displayMode]="displayMode()"
  [rows]="rows()"
  [texts]="sectionTexts"
  [confirmingCloseKey]="confirmingCloseKey()"
  [correctingKey]="correctingKey()"
  [canCreate]="supportedActions().canReplaceFromDate"
  [canEditCurrent]="false"
  [canCorrect]="supportedActions().canCorrect"
  [canClose]="supportedActions().canClose"
  [canDelete]="supportedActions().canDelete"
  [createSubmitEnabled]="isReplaceDraftValid()"
  [correctSubmitEnabled]="isCorrectDraftValid()"
  (manageStarted)="startReplaceFromDate()"
  (manageExited)="exitManage()"
  (createStarted)="startReplaceFromDate()"
  (correctStarted)="startCorrect($event)"
  (closeRequested)="requestClose($event)"
  (closeConfirmed)="confirmClose($event)"
  (cancelled)="cancel()"
  (createSubmitted)="submitReplaceFromDate()"
  (correctSubmitted)="submitCorrect($event)"
>
  <div temporalCreateForm class="employee-labor-classification-section__form-grid employee-labor-classification-section__form-grid--create">
    <label class="employee-labor-classification-section__field employee-labor-classification-section__field--effective-date">
      <span>{{ texts.laborClassificationSectionEffectiveDateLabel }}</span>
      <app-ui-date-input
        [value]="replaceDraft().effectiveDate"
        (valueChanged)="updateReplaceField('effectiveDate', $event)"
      />
    </label>

    <label class="employee-labor-classification-section__field employee-labor-classification-section__field--agreement">
      <span>{{ texts.laborClassificationSectionAgreementLabel }}</span>
      <app-ui-select
        [value]="replaceDraft().agreementCode"
        [disabled]="agreementOptionsLoading()"
        (valueChanged)="updateReplaceField('agreementCode', $event)"
      >
        <option value="">{{ texts.laborClassificationSectionAgreementLabel }}</option>
        @for (option of agreementOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>

    <label class="employee-labor-classification-section__field employee-labor-classification-section__field--category">
      <span>{{ texts.laborClassificationSectionCategoryLabel }}</span>
      <app-ui-select
        [value]="replaceDraft().agreementCategoryCode"
        [disabled]="replaceCategoryDisabled()"
        (valueChanged)="updateReplaceField('agreementCategoryCode', $event)"
      >
        <option value="">{{ texts.laborClassificationSectionCategoryLabel }}</option>
        @for (option of replaceCategoryOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>
  </div>

  <div temporalCorrectForm class="employee-labor-classification-section__form-grid employee-labor-classification-section__form-grid--correct">
    @if (correctingOccurrence(); as correctingOccurrence) {
      <label class="employee-labor-classification-section__field employee-labor-classification-section__field--start-readonly">
        <span>{{ texts.laborClassificationSectionOccurrenceStartDateLabel }}</span>
        <input type="text" [value]="correctingOccurrence.startDate" readonly />
      </label>
    }

    <label class="employee-labor-classification-section__field employee-labor-classification-section__field--agreement">
      <span>{{ texts.laborClassificationSectionAgreementLabel }}</span>
      <app-ui-select
        [value]="correctDraft().agreementCode"
        [disabled]="agreementOptionsLoading()"
        (valueChanged)="updateCorrectField('agreementCode', $event)"
      >
        <option value="">{{ texts.laborClassificationSectionAgreementLabel }}</option>
        @for (option of agreementOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>

    <label class="employee-labor-classification-section__field employee-labor-classification-section__field--category">
      <span>{{ texts.laborClassificationSectionCategoryLabel }}</span>
      <app-ui-select
        [value]="correctDraft().agreementCategoryCode"
        [disabled]="correctCategoryDisabled()"
        (valueChanged)="updateCorrectField('agreementCategoryCode', $event)"
      >
        <option value="">{{ texts.laborClassificationSectionCategoryLabel }}</option>
        @for (option of correctCategoryOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </app-ui-select>
    </label>
  </div>

  <div temporalConfirmCloseForm class="employee-labor-classification-section__close-form">
    <p class="employee-labor-classification-section__hint">{{ texts.laborClassificationSectionCloseHint }}</p>

    <label class="employee-labor-classification-section__field employee-labor-classification-section__field--close-date">
      <span>{{ texts.laborClassificationSectionCloseDateLabel }}</span>
      <app-ui-date-input
        [value]="closeDraft().endDate"
        (valueChanged)="updateCloseField('endDate', $event)"
      />
    </label>
  </div>
</app-temporal-section>
