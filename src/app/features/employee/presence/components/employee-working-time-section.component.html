<div class="working-time-section">
  <app-period-table
    sectionTitle="Jornada"
    [rows]="rows()"
    (addClicked)="openCreate()"
    (editClicked)="openEdit($event)"
  >
    <ng-template #columnHeaders>
      <th>%</th>
      <th>Horas/sem</th>
    </ng-template>
    <ng-template #cellContent let-row>
      <td>{{ row.workingTimePercentage }}%</td>
      <td>{{ row.weeklyHours }} h/sem
        <span class="working-time-section__sub">({{ row.dailyHours }} h/día)</span>
      </td>
    </ng-template>
  </app-period-table>

  <app-period-modal
    [title]="modalTitle()"
    [visible]="modalVisible()"
    [saving]="saving()"
    [submitEnabled]="isSubmitEnabled()"
    [submitLabel]="modalMode() === 'close' ? 'Cerrar jornada' : 'Guardar'"
    (visibleChange)="modalVisible.set($event)"
    (submitted)="submit()"
    (cancelled)="closeModal()"
  >
    @if (modalMode() === 'create') {
      <app-ui-date-input [value]="startDateDraft()" (valueChanged)="startDateDraft.set($event)" />
      <app-ui-input-number [value]="percentageDraft()" (valueChanged)="percentageDraft.set($event)" [min]="1" [max]="100" />
    }
    @if (modalMode() === 'close') {
      <app-ui-date-input [value]="endDateDraft()" (valueChanged)="endDateDraft.set($event)" />
    }
  </app-period-modal>
</div>
