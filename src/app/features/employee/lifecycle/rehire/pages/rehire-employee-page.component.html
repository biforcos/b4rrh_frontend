
<div class="rehire-page-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Page header -->
  <header class="rehire-page-header">
    <h1 class="rehire-title">Recontratar empleado</h1>
    <p class="rehire-subtitle">Reapertura del ciclo laboral para un empleado existente</p>
  </header>


  <p-message *ngIf="error()" severity="error" [text]="mapErrorMessage(error())" class="w-full mb-4 block"></p-message>

  <!-- Rehire data -->
  <section class="rehire-section">
    <h2 class="rehire-section-title">Datos de reincorporación</h2>
    <div class="rehire-fields">
      <div class="rehire-field">
        <label for="rehireDate">Fecha de reincorporación *</label>
        <p-datepicker id="rehireDate" formControlName="rehireDate" dateFormat="yy-mm-dd" [fluid]="true" appendTo="body" [showIcon]="true"></p-datepicker>
      </div>
      <div class="rehire-field">
        <label for="companyCode">Empresa *</label>
        <p-select id="companyCode" formControlName="companyCode" [options]="companies()" optionLabel="label" optionValue="value" placeholder="Selecciona empresa" [fluid]="true" appendTo="body"></p-select>
      </div>
      <div class="rehire-field">
        <label for="entryReasonCode">Motivo *</label>
        <p-select id="entryReasonCode" formControlName="entryReasonCode" [options]="entryReasons()" optionLabel="label" optionValue="value" placeholder="Selecciona motivo" [fluid]="true" appendTo="body"></p-select>
      </div>
    </div>
  </section>

  <!-- Organizational context -->
  <section class="rehire-section">
    <h2 class="rehire-section-title">Contexto organizativo inicial</h2>
    <div class="rehire-fields">
      <div class="rehire-field">
        <label for="workCenterCode">Centro de trabajo *</label>
        <p-select id="workCenterCode" formControlName="workCenterCode" [options]="workCenters()" optionLabel="label" optionValue="value" placeholder="Selecciona centro" [fluid]="true" appendTo="body"></p-select>
      </div>
      <div class="rehire-field">
        <label>Distribución de centros de coste (opcional)</label>
        <app-employee-cost-center-distribution-editor #ccEditor [initialValue]="null" [options]="costCenterOptions()" [dateLabel]="texts.costCenterSectionStartDateLabel"></app-employee-cost-center-distribution-editor>
      </div>
    </div>
  </section>

  <!-- Labor context -->
  <section class="rehire-section">
    <h2 class="rehire-section-title">Contexto laboral inicial</h2>
    <div class="rehire-fields rehire-fields--two-col">
      <div class="rehire-field">
        <label for="contractTypeCode">Tipo de contrato *</label>
        <p-select id="contractTypeCode" formControlName="contractTypeCode" [options]="contractTypes()" optionLabel="label" optionValue="value" placeholder="Selecciona tipo" [fluid]="true" appendTo="body"></p-select>
      </div>
      <div class="rehire-field">
        <label for="contractSubtypeCode">Subtipo</label>
        <p-select id="contractSubtypeCode" formControlName="contractSubtypeCode" [options]="contractSubtypes()" optionLabel="label" optionValue="value" placeholder="Selecciona subtipo" [fluid]="true" appendTo="body"></p-select>
      </div>
      <div class="rehire-field">
        <label for="agreementCode">Convenio *</label>
        <p-select id="agreementCode" formControlName="agreementCode" [options]="agreements()" optionLabel="label" optionValue="value" placeholder="Selecciona convenio" [fluid]="true" appendTo="body"></p-select>
      </div>
      <div class="rehire-field">
        <label for="agreementCategoryCode">Categoría *</label>
        <p-select id="agreementCategoryCode" formControlName="agreementCategoryCode" [options]="agreementCategories()" optionLabel="label" optionValue="value" placeholder="Selecciona categoria" [fluid]="true" appendTo="body"></p-select>
      </div>
    </div>
  </section>

  <!-- Footer actions -->
  <footer class="rehire-footer">
    <div class="rehire-footer-actions">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        severity="secondary"
        (click)="onCancel()"
        [disabled]="rehiring()"
      ></p-button>
      <p-button
        label="Recontratar empleado"
        icon="pi pi-check"
        (click)="onSubmit()"
        [loading]="rehiring()"
      ></p-button>
    </div>
  </footer>
  </form>
</div>
