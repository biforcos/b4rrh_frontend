<section id="employee-section-organization" class="employee-area" [attr.aria-label]="texts.organizationalAreaLabel">
  <div class="employee-area__state-stack">
    @if (organizationAreaLoading()) {
      <p class="employee-area__state">{{ texts.organizationLoadingMessage }}</p>
    }
  </div>

  <div class="employee-area__modules">
    <section class="employee-area__module">
      <app-employee-work-center-section [employeeKey]="activeEmployeeKey()" />
    </section>

    <section class="employee-area__module">
      <app-employee-cost-center-section [employeeKey]="activeEmployeeKey()" />
    </section>

  </div>
</section>
