<app-editable-slot-section
  [title]="texts.contactsSectionTitle"
  [subtitle]="sectionSubtitle"
  [state]="sectionState()"
  [displayMode]="displayMode()"
  [rows]="rows()"
  [texts]="slotTexts"
  [draft]="draft()"
  [editingKey]="editingKey()"
  [deletingKey]="deletingKey()"
  [canCreate]="true"
  [canEdit]="true"
  [canDelete]="true"
  (manageStarted)="startManage()"
  (manageExited)="exitManage()"
  (createStarted)="startCreate()"
  (editStarted)="startEdit($event)"
  (deleteRequested)="requestDelete($event)"
  (deleteConfirmed)="confirmDelete($event)"
  (cancelled)="cancel()"
  (draftKeyChanged)="updateDraftKey($event)"
  (draftValueChanged)="updateDraftValue($event)"
  (createSubmitted)="submitCreate($event)"
  (editSubmitted)="submitEdit($event)"
>
  <ng-template #slotCreateForm slotCreateForm>
    <div class="employee-contact-section__form-grid">
      <div class="employee-contact-section__form-field">
        <label class="employee-contact-section__form-label" for="contactTypeInput">{{ texts.contactsSectionKeyFieldLabel }}</label>
        <input
          id="contactTypeInput"
          class="employee-contact-section__form-input"
          type="text"
          [value]="draft().key ?? ''"
          (input)="updateDraftKey($any($event.target).value)"
          placeholder="Tipo de contacto"
        />
      </div>

      <div class="employee-contact-section__form-field">
        <label class="employee-contact-section__form-label" for="contactValueInput">{{ texts.contactsSectionValueFieldLabel }}</label>
        <input
          id="contactValueInput"
          class="employee-contact-section__form-input"
          type="text"
          [value]="draft().value"
          (input)="updateDraftValue($any($event.target).value)"
          placeholder="Valor de contacto"
        />
      </div>
    </div>
  </ng-template>
</app-editable-slot-section>
