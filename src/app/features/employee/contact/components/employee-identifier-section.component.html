<app-editable-slot-section
  [title]="texts.identifiersSectionTitle"
  [subtitle]="sectionSubtitle"
  [state]="sectionState()"
  [displayMode]="displayMode()"
  [rows]="rows()"
  [texts]="slotTexts"
  [draft]="slotDraft()"
  [editingKey]="editingKey()"
  [deletingKey]="deletingKey()"
  [availableKeys]="availableKeys()"
  [canCreate]="true"
  [canEdit]="true"
  [canDelete]="true"
  (manageStarted)="startManage()"
  (manageExited)="exitManage()"
  (createStarted)="startCreate()"
  (editStarted)="startEdit($event)"
  (deleteRequested)="requestDelete($event)"
  (deleteConfirmed)="confirmDelete($event)"
  (cancelled)="cancel()"
  (createSubmitted)="submitCreate()"
  (editSubmitted)="submitEdit()"
>
  <ng-template #slotCreateForm slotCreateForm>
    <div class="employee-identifier-section__form-grid">
      <label class="employee-identifier-section__field employee-identifier-section__field--key">
        <span>{{ texts.identifiersSectionKeyFieldLabel }}</span>
        <input type="text" [value]="draft().key ?? ''" (input)="updateDraftKey($any($event.target).value)" />
      </label>

      <label class="employee-identifier-section__field employee-identifier-section__field--value">
        <span>{{ texts.identifiersSectionValueFieldLabel }}</span>
        <input
          type="text"
          [class.employee-identifier-section__input--invalid]="isDniInvalid()"
          [value]="draft().value"
          (input)="updateDraftValue($any($event.target).value)"
        />
        @if (isDniInvalid()) {
          <small class="employee-identifier-section__field-error">{{ texts.identifiersSectionInvalidDniMessage }}</small>
        }
      </label>

      <label class="employee-identifier-section__field employee-identifier-section__field--country">
        <span>{{ texts.identifiersSectionIssuingCountryLabel }}</span>
        <input
          type="text"
          [value]="draft().issuingCountryCode"
          (input)="updateDraftIssuingCountryCode($any($event.target).value)"
        />
      </label>

      <label class="employee-identifier-section__field employee-identifier-section__field--date">
        <span>{{ texts.identifiersSectionExpirationDateLabel }}</span>
        <input
          type="date"
          [value]="draft().expirationDate"
          (input)="updateDraftExpirationDate($any($event.target).value)"
        />
      </label>

      <label class="employee-identifier-section__checkbox-field">
        <input
          type="checkbox"
          [checked]="draft().isPrimary"
          (change)="updateDraftIsPrimary($any($event.target).checked)"
        />
        <span>{{ texts.identifiersSectionIsPrimaryLabel }}</span>
      </label>
    </div>
  </ng-template>

  <ng-template #slotEditForm slotEditForm>
    <div class="employee-identifier-section__form-grid">
      <div class="employee-identifier-section__readonly-field employee-identifier-section__field employee-identifier-section__field--key">
        <span>{{ texts.identifiersSectionKeyFieldLabel }}</span>
        <strong>{{ draft().key }}</strong>
      </div>

      <label class="employee-identifier-section__field employee-identifier-section__field--value">
        <span>{{ texts.identifiersSectionValueFieldLabel }}</span>
        <input
          type="text"
          [class.employee-identifier-section__input--invalid]="isDniInvalid()"
          [value]="draft().value"
          (input)="updateDraftValue($any($event.target).value)"
        />
        @if (isDniInvalid()) {
          <small class="employee-identifier-section__field-error">{{ texts.identifiersSectionInvalidDniMessage }}</small>
        }
      </label>

      <label class="employee-identifier-section__field employee-identifier-section__field--country">
        <span>{{ texts.identifiersSectionIssuingCountryLabel }}</span>
        <input
          type="text"
          [value]="draft().issuingCountryCode"
          (input)="updateDraftIssuingCountryCode($any($event.target).value)"
        />
      </label>

      <label class="employee-identifier-section__field employee-identifier-section__field--date">
        <span>{{ texts.identifiersSectionExpirationDateLabel }}</span>
        <input
          type="date"
          [value]="draft().expirationDate"
          (input)="updateDraftExpirationDate($any($event.target).value)"
        />
      </label>

      <label class="employee-identifier-section__checkbox-field">
        <input
          type="checkbox"
          [checked]="draft().isPrimary"
          (change)="updateDraftIsPrimary($any($event.target).checked)"
        />
        <span>{{ texts.identifiersSectionIsPrimaryLabel }}</span>
      </label>
    </div>
  </ng-template>
</app-editable-slot-section>
