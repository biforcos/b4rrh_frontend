<section id="employee-section-contact" class="employee-area" [attr.aria-label]="texts.personalAreaLabel">
  <div class="employee-area__state-stack">
    @if (loadingPersonals()) {
      <p class="employee-area__state">{{ texts.personalLoadingMessage }}</p>
    }
  </div>

  <div class="employee-area__modules">
    <section class="employee-area__module">
      <app-employee-contact-section [employeeKey]="activeEmployeeKey()" />
    </section>

    <section class="employee-area__module">
      <app-employee-address-section [employeeKey]="activeEmployeeKey()" />
    </section>

    <section class="employee-area__module">
      <app-employee-identifier-section [employeeKey]="activeEmployeeKey()" />
    </section>
  </div>
</section>
