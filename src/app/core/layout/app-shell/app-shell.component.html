<div class="app-shell">
  <div class="app-shell__workspace">
    <aside class="app-shell__sidebar" [attr.aria-label]="texts.navigationAriaLabel">
      <a class="app-shell__brand" [routerLink]="['/inicio']" [attr.aria-label]="texts.brandHomeAriaLabel">
        <span class="app-shell__brand-mark">B4</span>
        <span class="app-shell__brand-copy">
          <strong>{{ texts.brandName }}</strong>
        </span>
      </a>

      <section class="app-shell__auth" [attr.aria-label]="texts.authCurrentSubjectLabel">
        <div class="app-shell__auth-copy">
          <span>{{ texts.authCurrentSubjectLabel }}</span>
          <strong>{{ auth.subject() ?? '—' }}</strong>
        </div>

        <app-ui-button
          [label]="texts.authLogoutAction"
          severity="secondary"
          [outlined]="true"
          [fluid]="true"
          (pressed)="logout()"
        />
      </section>

      <p-panelmenu class="app-shell__panelmenu" [model]="sideNavItems" />
    </aside>

    <main class="app-shell__main" aria-live="polite">
      <router-outlet />
    </main>
  </div>
</div>
