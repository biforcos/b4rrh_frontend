server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Ficheros de nombre fijo: cacheables, pero revalidables.
    location ~* ^/(favicon\.ico|robots\.txt|site\.webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Assets con hash en el nombre: no cambian nunca.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # UNA sola regla para toda la API. Este es el pago del prefijo /api:
    # el dia que el backend estrene un recurso, aqui no hay que tocar nada.
    location /api/ {
        # DNS interno de Docker. Sin estas dos lineas, nginx resuelve "api"
        # UNA sola vez al arrancar y se queda con esa IP para siempre: si el
        # backend se recrea despues y Docker le da otra, nginx sigue mandando
        # paquetes a un sitio vacio y devuelve 502 hasta que lo reinicias.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:8080;

        # Con una variable en proxy_pass, nginx deja de anadir la ruta por su
        # cuenta: hay que pasarle $request_uri, que incluye ruta y query.
        proxy_pass $upstream_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }

    # Angular es una SPA: cualquier ruta desconocida la resuelve el front.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
